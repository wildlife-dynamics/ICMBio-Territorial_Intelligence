id: hunting_intelligence

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  # ICMBio-specific task package, still under active local development —
  # built via `make build` (wd-partner-tasks: BUILD_PKG=icmbio pixi run
  # build-release) into the local channel below, not the published one, so
  # source changes here take effect on the next `make compile` without
  # needing a release first. Matches ICMBio-patrol_analysis's own dev-time
  # setup (see its commit "switch ext-icmbio to local channel") — pin to a
  # real published version once these new tasks are actually released.
  - name: ecoscope-workflows-ext-icmbio
    version: "*"
    channel: file:///tmp/ecoscope-workflows-custom/release/artifacts/

rjsf-overrides:
  properties:
    Report.properties.report_template_path.properties.var.title: Template Path
    Report.properties.report_template_path.properties.var.description: "Path or URL to the .docx Jinja2 template used for the hunting intelligence report."
    Report.properties.report_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/ICMBio-Territorial_Intelligence/main/resources/templates/relatorio_inteligencia_territorial_caca_template.docx"
    Report.properties.report_template_path.properties.var.ecoscope:advanced: false

    download_attachments.properties.skip_download.title: Skip Photo Attachments
    download_attachments.properties.skip_download.description: "If True, skip downloading event photos, and the report will not include any images in the Evidências Fotográficas section."
    download_attachments.properties.skip_download.ecoscope:advanced: false

    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.radius_km.title: Cluster Radius (km)
    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.radius_km.description: "Approximate radius used to group nearby events into a hotspot — matches the report's own stated exploratory methodology."
    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.radius_km.ecoscope:advanced: false
    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.min_events.title: Minimum Events per Hotspot
    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.min_events.description: "Minimum number of nearby events required to count as a hotspot."
    Distribuição Territorial e Hotspots.properties.hotspots_clustered.properties.min_events.ecoscope:advanced: false

    Map Viewport.properties.viewport_settings.properties.settings.title: Map Viewport
    Map Viewport.properties.viewport_settings.properties.settings.description: "Controls how tightly the events map zooms and frames its data. Only adjust if the map consistently looks too zoomed in or out."
    Map Viewport.properties.viewport_settings.properties.settings.ecoscope:advanced: true

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  - name: Define Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers: []

  - title: Map Viewport
    type: task-group
    description: "Controls how tightly the events map zooms and frames its data."
    tasks:
      - id: viewport_settings
        task: ecoscope_workflows_ext_icmbio.tasks.set_viewport_settings

  - title: Hunting Events
    type: task-group
    description: "Fetch and resolve all Caça (hunting) events in the reporting period."
    tasks:
      - id: events_raw
        task: get_events
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          event_types:
            - caceria
          event_states: []
          event_columns:
            - id
            - time
            - event_type
            - event_category
            - serial_number
            - event_details
            - geometry
            - reported_by
          include_details: true
          include_display_values: true
          include_null_geometry: false
          include_updates: false
          include_related_events: false
          force_point_geometry: true
          raise_on_empty: false

      - id: convert_events_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.events_raw.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - time

      - id: events_details_resolved
        task: process_events_details
        partial:
          df: ${{ workflow.convert_events_tz.return }}
          client: ${{ workflow.er_client.return }}
          map_to_titles: true
          ordered: true

      - id: events_with_lat_lon
        task: add_lat_lon_to_gdf
        partial:
          event_gdf: ${{ workflow.events_details_resolved.return }}

      - id: events_fields
        task: ecoscope_workflows_ext_icmbio.tasks.extract_hunting_fields
        partial:
          df: ${{ workflow.events_with_lat_lon.return }}

  - title: Caracterização Geral
    type: task-group
    description: "Total events, reporting period, active/inactive site counts, offender presence."
    tasks:
      - id: total_events
        task: dataframe_count
        partial:
          df: ${{ workflow.events_fields.return }}

      - name: Eventos Analisados Widget
        id: total_events_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Eventos analisados"
          decimal_places: 0
          data: ${{ workflow.total_events.return }}

      - id: periodo_text
        task: ecoscope_workflows_ext_icmbio.tasks.format_time_range
        partial:
          time_range: ${{ workflow.time_range.return }}

      - name: Período Widget
        id: periodo_sv
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Período"
          data: ${{ workflow.periodo_text.return }}

      - id: locais_ativos_events
        task: filter_row_values
        partial:
          df: ${{ workflow.events_fields.return }}
          column: situacao_local
          values: ["Ativo"]

      - id: locais_ativos_count
        task: dataframe_count
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.locais_ativos_events.return }}

      - id: locais_ativos_text
        task: ecoscope_workflows_ext_icmbio.tasks.format_count_and_percent
        partial:
          count: ${{ workflow.locais_ativos_count.return }}
          total: ${{ workflow.total_events.return }}
          decimal_places: 1

      - name: Locais Ativos Widget
        id: locais_ativos_sv
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Locais ativos"
          data: ${{ workflow.locais_ativos_text.return }}

      - id: locais_inativos_events
        task: filter_row_values
        partial:
          df: ${{ workflow.events_fields.return }}
          column: situacao_local
          values: ["Inativo"]

      - id: locais_inativos_count
        task: dataframe_count
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.locais_inativos_events.return }}

      - id: locais_inativos_text
        task: ecoscope_workflows_ext_icmbio.tasks.format_count_and_percent
        partial:
          count: ${{ workflow.locais_inativos_count.return }}
          total: ${{ workflow.total_events.return }}
          decimal_places: 1

      - name: Locais Inativos Widget
        id: locais_inativos_sv
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Locais inativos"
          data: ${{ workflow.locais_inativos_text.return }}

      - id: infrator_events
        task: filter_row_values
        partial:
          df: ${{ workflow.events_fields.return }}
          column: infrator_presente
          values: ["Sim"]

      - id: infrator_count
        task: dataframe_count
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.infrator_events.return }}

      - name: Infrator Presente Widget
        id: infrator_presente_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Eventos com infrator presente"
          decimal_places: 0
          data: ${{ workflow.infrator_count.return }}

  - title: Distribuição Temporal
    type: task-group
    description: "Monthly distribution of hunting events."
    tasks:
      - id: temporal_bar_chart
        task: draw_time_series_bar_chart
        partial:
          dataframe: ${{ workflow.events_fields.return }}
          x_axis: time
          y_axis: id
          category: event_type_display
          agg_function: count
          time_interval: month
          color_column: null
          plot_style:
            texttemplate: "%{y}"
            textposition: outside
          layout_style:
            showlegend: false
            title: null
            title_x: 0.5
            xaxis:
              title: null
            yaxis:
              title: "Número de eventos"

      - id: temporal_bar_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.temporal_bar_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: temporal_bar_chart

      - name: Distribuição Mensal Widget
        id: temporal_bar_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Distribuição mensal dos eventos relacionados à caça"
          data: ${{ workflow.temporal_bar_chart_html.return }}

  - title: Caracterização Operacional
    type: task-group
    description: "Site status, estimated activity time, structures observed, actions taken."
    tasks:
      - id: situacao_bar_chart
        task: draw_bar_chart
        partial:
          dataframe: ${{ workflow.events_fields.return }}
          category: situacao_local
          bar_chart_configs:
            - column: id
              agg_func: count
              label: Quantidade
              show_label: true
          layout_kwargs:
            title: null
            yaxis:
              title: "Número de eventos"

      - id: situacao_bar_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.situacao_bar_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: situacao_bar_chart

      - name: Situação dos Locais Widget
        id: situacao_bar_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Situação observada nos locais de caça"
          data: ${{ workflow.situacao_bar_chart_html.return }}

      - id: tempo_bar_chart
        task: draw_bar_chart
        partial:
          dataframe: ${{ workflow.events_fields.return }}
          category: tempo_estimado_display
          bar_chart_configs:
            - column: id
              agg_func: count
              label: Quantidade
              show_label: true
          layout_kwargs:
            title: null
            yaxis:
              title: "Número de eventos"

      - id: tempo_bar_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.tempo_bar_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: tempo_bar_chart

      - name: Tempo Estimado Widget
        id: tempo_bar_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Tempo estimado da atividade nos locais registrados"
          data: ${{ workflow.tempo_bar_chart_html.return }}

      - id: hunting_structures
        task: ecoscope_workflows_ext_icmbio.tasks.explode_hunting_structures
        partial:
          df: ${{ workflow.events_fields.return }}

      - id: estruturas_bar_chart
        task: ecoscope_workflows_ext_icmbio.tasks.draw_horizontal_bar_chart
        partial:
          dataframe: ${{ workflow.hunting_structures.return }}
          category: estrutura
          bar_configs:
            - column: id
              agg_func: count
              label: Quantidade
              show_label: true
          sort_descending: true
          layout_kwargs:
            title: null
            xaxis:
              title: "Número de registros"

      - id: estruturas_bar_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.estruturas_bar_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: estruturas_bar_chart

      - name: Estruturas Widget
        id: estruturas_bar_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Estruturas e evidências registradas"
          data: ${{ workflow.estruturas_bar_chart_html.return }}

      - id: acoes_bar_chart
        task: ecoscope_workflows_ext_icmbio.tasks.draw_horizontal_bar_chart
        partial:
          dataframe: ${{ workflow.events_fields.return }}
          category: acao_tomada
          bar_configs:
            - column: id
              agg_func: count
              label: Quantidade
              show_label: true
          sort_descending: true
          layout_kwargs:
            title: null
            xaxis:
              title: "Número de eventos"

      - id: acoes_bar_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.acoes_bar_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: acoes_bar_chart

      - name: Ações Widget
        id: acoes_bar_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Ações adotadas pelas equipes"
          data: ${{ workflow.acoes_bar_chart_html.return }}

  - title: Distribuição Territorial e Hotspots
    type: task-group
    description: "General events map, spatial density, and exploratory hotspot clustering."
    tasks:
      - id: event_colormap
        task: ecoscope_workflows_ext_icmbio.tasks.apply_qualitative_color_map
        partial:
          df: ${{ workflow.events_fields.return }}
          input_column_name: event_type_display
          colormap: Set2

      - id: event_legend_title
        task: set_string_var
        partial:
          var: "Tipo de evento"

      - id: event_layer
        task: create_scatterplot_layer
        partial:
          geodataframe: ${{ workflow.event_colormap.return }}
          legend:
            title: ${{ workflow.event_legend_title.return }}
            label_column: column_label
            color_column: column_color
          data_url: null
          layer_style:
            get_fill_color: column_color
            get_line_color: column_color

      - id: events_map_view_state
        task: compute_view_from_geodataframes
        partial:
          geodataframe: ${{ workflow.event_colormap.return }}
          viewport: ${{ workflow.viewport_settings.return }}

      - id: events_map
        task: draw_map
        partial:
          geo_layers:
            - ${{ workflow.event_layer.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          view_state: ${{ workflow.events_map_view_state.return }}
          static: false
          title: null
          max_zoom: 17
          legend_style:
            placement: bottom-right
          output_type: html

      - id: events_map_url
        task: persist_text
        partial:
          text: ${{ workflow.events_map.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename: hunting_events_map.html
          filename_suffix: null

      - name: Mapa Geral dos Eventos Widget
        id: events_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Mapa geral dos eventos"
          data: ${{ workflow.events_map_url.return }}

      - id: hotspots_clustered
        task: ecoscope_workflows_ext_icmbio.tasks.cluster_hunting_hotspots
        partial:
          df: ${{ workflow.events_fields.return }}

      - id: hotspots_summary
        task: ecoscope_workflows_ext_icmbio.tasks.summarize_hotspots
        partial:
          df: ${{ workflow.hotspots_clustered.return }}

      - id: agrupamentos_count
        task: dataframe_count
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.hotspots_summary.return }}

      - name: Agrupamentos Widget
        id: agrupamentos_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Agrupamentos espaciais exploratórios"
          decimal_places: 0
          data: ${{ workflow.agrupamentos_count.return }}

      - id: hotspots_table_renamed
        task: map_columns
        partial:
          df: ${{ workflow.hotspots_summary.return }}
          retain_columns:
            - Agrupamento
            - Eventos
            - Locais ativos
            - Coordenada central
            - Referência descritiva predominante
          raise_if_not_found: false
          drop_columns: null
          rename_columns: null
          duplicate_strategy: suffix

      - id: hotspots_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.hotspots_table_renamed.return }}
          columns: null
          table_config: null

      - id: hotspots_table_html
        task: persist_text
        partial:
          text: ${{ workflow.hotspots_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: hotspots_table

      - name: Hotspots Table Widget
        id: hotspots_table_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Agrupamentos"
          data: ${{ workflow.hotspots_table_html.return }}

      - id: density_chart_png
        task: ecoscope_workflows_ext_icmbio.tasks.draw_hunting_density_chart
        partial:
          events_df: ${{ workflow.hotspots_clustered.return }}
          hotspots_df: ${{ workflow.hotspots_summary.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      - id: density_chart_wrapped
        task: ecoscope_workflows_ext_icmbio.tasks.wrap_image_as_html
        partial:
          image_path: ${{ workflow.density_chart_png.return }}

      - id: density_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.density_chart_wrapped.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: density_chart

      - name: Densidade Widget
        id: density_chart_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Densidade relativa e agrupamentos espaciais exploratórios"
          data: ${{ workflow.density_chart_html.return }}

  - title: Patrol Effort
    type: task-group
    description: "Km patrulhados, horas trabalhadas, and TDEA (Taxa de Detecção de Estruturas Ativas) — patrol-effort context for comparing hunting pressure across periods."
    tasks:
      - id: patrol_observations
        task: get_patrol_observations
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          include_patrol_details: true
          raise_on_empty: false
          # Larger than core's default of 100 — a 6-month, park-wide patrol
          # window can span tens of thousands of GPS observations; at 100
          # per page that's an impractical number of sequential HTTP
          # requests (observed to effectively hang for over an hour on a
          # slower connection).
          sub_page_size: 5000
          patrol_types: []
          status:
            - done
            - active
            - overdue
            - cancelled

      - id: convert_patrols_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_observations.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - patrol_start_time
            - patrol_end_time
            - fixtime

      - id: relocs
        task: process_relocations
        partial:
          observations: ${{ workflow.convert_patrols_tz.return }}
          relocs_columns:
            - patrol_id
            - patrol_start_time
            - patrol_end_time
            - patrol_serial_number
            - groupby_col
            - fixtime
            - junk_status
            - geometry
          filter_point_coords:
            - x: 180.000000
              y: 90.000000
            - x: 0.000000
              y: 0.000000
            - x: 1.000000
              y: 1.000000

      - id: relocs_in_bounds
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.relocs.return }}
          roi_gdf: null
          roi_name: null
          bounding_box: null
          reset_index: true

      - id: trajs
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.relocs_in_bounds.return }}
          trajectory_segment_filter:
            min_length_meters: 0.001
            max_length_meters: 500
            min_time_secs: 1
            max_time_secs: 172800
            min_speed_kmhr: 0.01
            max_speed_kmhr: 500

      - id: total_patrols
        task: dataframe_column_nunique
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_id

      - name: Número de Patrulhas Widget
        id: total_patrols_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Número de patrulhas"
          decimal_places: 0
          data: ${{ workflow.total_patrols.return }}

      - id: total_distance
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: dist_meters

      - id: total_distance_km
        task: with_unit
        partial:
          original_unit: m
          new_unit: km
          value: ${{ workflow.total_distance.return }}

      - name: Km Patrulhados Widget
        id: total_distance_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Km patrulhados"
          decimal_places: 2
          data: ${{ workflow.total_distance_km.return }}

      - id: total_time
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: timespan_seconds

      - id: total_hours
        task: with_unit
        partial:
          original_unit: s
          new_unit: h
          value: ${{ workflow.total_time.return }}

      - name: Horas Trabalhadas Widget
        id: total_hours_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Horas trabalhadas"
          decimal_places: 2
          data: ${{ workflow.total_hours.return }}

      - id: active_structures
        task: filter_row_values
        partial:
          df: ${{ workflow.hunting_structures.return }}
          column: situacao_local
          values: ["Ativo"]

      - id: estruturas_ativas_count
        task: dataframe_count
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.active_structures.return }}

      - id: total_distance_km_value
        task: ecoscope_workflows_ext_icmbio.tasks.extract_quantity_value
        skipif:
          conditions:
            - never
        partial:
          value: ${{ workflow.total_distance_km.return }}

      - id: tdea_ratio
        task: apply_arithmetic_operation
        skipif:
          conditions:
            - never
        partial:
          a: ${{ workflow.estruturas_ativas_count.return }}
          b: ${{ workflow.total_distance_km_value.return }}
          operation: divide

      - id: tdea_index
        task: apply_arithmetic_operation
        skipif:
          conditions:
            - never
        partial:
          a: ${{ workflow.tdea_ratio.return }}
          b: 100
          operation: multiply

      - name: TDEA Widget
        id: tdea_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "TDEA (estruturas ativas / 100km)"
          decimal_places: 2
          data: ${{ workflow.tdea_index.return }}

  - title: Report Images to PNG
    type: task-group
    description: "Convert the persisted chart/map HTML files to PNG for the docx report."
    tasks:
      - id: events_map_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.events_map_url.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            width: 1280
            height: 720
            full_page: true
            device_scale_factor: 2
