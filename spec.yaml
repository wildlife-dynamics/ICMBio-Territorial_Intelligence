  - title: Report
    type: task-group
    description: ""
    tasks:
      - id: report_template_path
        task: set_string_var

      - id: report_context
        task: ecoscope_workflows_ext_icmbio.tasks.prepare_hunting_report_context
        skipif:
          conditions:
            - never
        partial:
          time_range: ${{ workflow.time_range.return }}
          total_events: ${{ workflow.total_events.return }}
          locais_ativos: ${{ workflow.locais_ativos_text.return }}
          locais_inativos: ${{ workflow.locais_inativos_text.return }}
