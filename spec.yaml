          total_hours: ${{ workflow.total_hours.return }}
          estruturas_ativas: ${{ workflow.estruturas_ativas_count.return }}
          tdea: ${{ workflow.tdea_index.return }}
          hotspots: ${{ workflow.hotspots_table_renamed.return }}
          photo_attachment_paths: ${{ workflow.download_attachments.return }}

      - id: hunting_report
