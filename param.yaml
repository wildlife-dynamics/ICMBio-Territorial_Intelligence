# Real values confirmed live against the parnaiguacu EarthRanger account:
# 126 geolocated 'caceria' (hunting) events over the last ~12 months at the
# time of writing. The reference report itself uses a 6-month period
# (Relatorio_Inteligencia_Territorial_Caca_EarthRanger_Versao_Final.pdf:
# "Janeiro a junho de 2026") — widen time_range back to that (2026-01-01 to
# 2026-07-01) once things are confirmed working. Narrowed to 1 month here
# for fast local dev iteration: a 6-month, park-wide get_patrol_observations
# fetch (Patrol Effort/TDEA section) takes much longer than a 1-month one.

workflow_details:
  name: Relatório de Inteligência Territorial
  description: ""

er_client:
  data_source:
    name: parnaiguacu

time_range:
  since: "2026-06-01T00:00:00.000Z"
  until: "2026-07-01T00:00:00.000Z"

base_maps:
  base_maps:
    - url: >-
        https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
    - url: >-
        https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5

hotspots_clustered:
  radius_km: 4.0
  min_events: 3

download_attachments:
  skip_download: true

# docxtpl template built from scratch by scripts/build_relatorio_caca_template.py
# (see that script's docstring — no partner-supplied source .docx exists for
# this report, unlike ICMBio-patrol_analysis's relatorio_bimestral_template.docx).
report_template_path:
  var: "file:///Users/zak/Documents/w-dynamics/ICMBio-Territorial_Intelligence/resources/templates/relatorio_inteligencia_territorial_caca_template.docx"
